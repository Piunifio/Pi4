<h3>Produtos Disponíveis</h3>

<!-- botao para alterar a exibicao -->
 <div style="margin-bottom: 15px;">
    <button (click)="alterarFiltro()">
        {{ somenteDisponiveis ? 'Mostrar Todos os Produtos' : 'Mostrar Apenas Disponíveis (Qtd > 0)' }}
    </button>

    <p>Filtro atual: <strong>{{ somenteDisponiveis ? 'Apenas com estoque' : 'Todos os produtos' }}</strong></p>
 </div>

 <!-- ng-container combinar *ngFor e o *ngIf -->
  <ng-container *ngFor="let prod of produtos; let i = index">

    <!-- decisao de exbicao direto na interface -->
     <div *ngIf="!somenteDisponiveis || prod.quantidade > 0">
        <p>
            <strong>#{{ i + 1 }}</strong> - {{ prod.nome }} |
            Preço: {{ prod.preco | currency: 'BRL':'R$' }} |
            Quantidade: {{ prod.quantidade }} |

            <span *ngIf="prod.quantidade > 0" style="color: green;">
                Em Estoque
            </span>
        </p>
        <hr>
     </div>
  </ng-container>
