<h3>Cadastro Simplificado</h3>

<div class="form-container">
  <h4>Cadastrar Novo Produto</h4>

  <!-- mensagem de ERRO -->
  <p *ngIf="mensagemErro" class="mensagem-erro">
    ⚠️ {{ mensagemErro }}
  </p>

  <div>
    <label for="nome">Nome do Produto:</label><br>
    <input 
      type="text" 
      id="nome" 
      [(ngModel)]="novoNome" 
      placeholder="Ex: Monitor"
    >
  </div>

  <br>

  <div>
    <label for="quantidade">Quantidade:</label><br>
    <input 
      type="number" 
      id="quantidade" 
      [(ngModel)]="novaQuantidade" 
      placeholder="Ex: 5" 
      min="0"
    >
  </div>

  <br>

  <button (click)="cadastrarProduto()">Cadastrar Produto</button>
</div>

<hr>

<h4>Lista de Produtos</h4>

<p *ngIf="produtos.length === 0">Nenhum produto cadastrado no momento.</p>

<!-- Lista produtos -->
<div *ngFor="let prod of produtos; let i = index">
  <p>
    <strong>#{{ i + 1 }}</strong> - {{ prod.nome }} | 
    Preço: {{ prod.preco | currency:'BRL':'symbol' }} | 
    Qtd: {{ prod.quantidade }}

    <!-- Excluir produto -->
    <button (click)="excluirProduto(i)" class="btn-excluir">
      Excluir
    </button>
  </p>
  <hr>
</div>
